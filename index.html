<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Control de asistencia</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>


* {
  box-sizing: border-box;
}


body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 10px;
  background: #eef2f5;
}


.contenedor {


  width: 100%;
  max-width: 700px;
  min-height: 100vh;
  margin: auto;
  background: white;
  border-radius: 20px;
  padding: 25px 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.18);


}




h2 {


  font-size: 34px;
  margin: 10px;


}




#contador {


  background: #1976d2;
  color: white;
  font-size: 30px;
  font-weight: bold;
  padding: 15px;
  border-radius: 15px;
  margin: 20px 0;


}




h3 {


  font-size: 26px;
  margin: 20px;


}




#lector {


  width: 100%;
  max-width: 420px;
  margin: auto;


}




button {


  width: 95%;
  max-width: 400px;
  font-size: 24px;
  font-weight: bold;
  padding: 18px;
  margin: 12px;
  border-radius: 15px;
  border: none;
  background: #1976d2;
  color: white;


}




button:active {


  transform: scale(0.97);


}




input {


  width: 95%;
  max-width: 400px;
  font-size: 26px;
  padding: 18px;
  text-align: center;
  border-radius: 15px;
  border: 2px solid #888;


}




hr {


  margin: 30px 0;
  border: none;
  border-top: 2px solid #ddd;


}




#mensaje {


  margin-top: 25px;
  font-size: 30px;
  font-weight: bold;
  padding: 20px;
  border-radius: 15px;


}




.verde {


  background:#c8e6c9;
  color:#1b5e20;


}




.amarillo {


  background:#fff3cd;
  color:#856404;


}




.rojo {


  background:#ffcdd2;
  color:#b71c1c;


}




</style>


</head>




<body>




<div class="contenedor">




<h2>
📋 Control de asistencia
</h2>




<div id="contador">
Presentes hoy: 0
</div>




<h3>
📷 Escanear QR
</h3>




<div id="lector"></div>




<button onclick="nuevoEscaneo()">
🔄 Nuevo escaneo
</button>




<hr>




<h3>
🪪 Carga manual por DNI
</h3>




<input
id="dni"
type="number"
placeholder="Ingrese DNI"
>




<br>




<button onclick="enviarDNI()">
Registrar DNI
</button>




<div id="mensaje">
Esperando...
</div>




</div>




<script>


const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzDtGXmfwOfobkyXSHSwe3o5h-lbzS83tZYzha0qDqUE7fBiMweoAhdz94WnMT8aHmQ/exec";




let scanner;






function cargarContador(){


const url =
URL_APPS_SCRIPT + "?contador=true";




fetch(url,{
method:"GET",
redirect:"follow"
})


.then(r=>r.json())


.then(data=>{


if(data.presentesHoy !== undefined){


document.getElementById("contador").innerHTML =
"Presentes hoy: " + data.presentesHoy;


}


})


.catch(error=>{


console.log(error);


});


}








function mostrarResultado(data){


const mensaje =
document.getElementById("mensaje");




if(data.presentesHoy !== undefined){


document.getElementById("contador").innerHTML =
"Presentes hoy: " + data.presentesHoy;


}






if(data.encontrado){




if(data.duplicado){


mensaje.className="amarillo";


mensaje.innerHTML =
"⚠️ Ya registrado hoy:<br>" + data.nombre;




}else{




mensaje.className="verde";


mensaje.innerHTML =
"✅ Presente:<br>" + data.nombre;




}




}else{




mensaje.className="rojo";


mensaje.innerHTML =
"❌ No encontrado";




}




}










function enviarID(id){


const url =
URL_APPS_SCRIPT + "?id=" + encodeURIComponent(id);






fetch(url,{
method:"GET",
redirect:"follow"
})




.then(r=>r.json())


.then(data=>{


mostrarResultado(data);


})




.catch(error=>{


document.getElementById("mensaje").innerHTML =
"Error: " + error.message;


});




}










function enviarDNI(){




const dni =
document.getElementById("dni").value;






if(!dni){


document.getElementById("mensaje").innerHTML =
"Ingrese DNI";


return;


}






const url =
URL_APPS_SCRIPT + "?dni=" + encodeURIComponent(dni);






fetch(url,{
method:"GET",
redirect:"follow"
})




.then(r=>r.json())


.then(data=>{


mostrarResultado(data);


document.getElementById("dni").value="";




})




.catch(error=>{


document.getElementById("mensaje").innerHTML =
"Error: " + error.message;


});




}










function iniciarQR(){




scanner =
new Html5QrcodeScanner(


"lector",


{
fps:10,
qrbox:320
}


);






scanner.render(


(textoQR)=>{


scanner.clear();


enviarID(textoQR);


},


(error)=>{}


);




}










function nuevoEscaneo(){




document.getElementById("lector").innerHTML="";




document.getElementById("mensaje").innerHTML =
"Esperando QR...";




document.getElementById("mensaje").className="";




iniciarQR();




}










cargarContador();


iniciarQR();




</script>




</body>
</html>
