<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Control de asistencia</title>


<script src="https://unpkg.com/html5-qrcode"></script>


<style>


body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 20px;
  background: #f5f5f5;
}


h2 {
  margin-bottom: 10px;
}


.contenedor {
  background: white;
  padding: 20px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 2px 8px #ccc;
}


#lector {
  width: 300px;
  margin: auto;
}


input {
  font-size: 18px;
  padding: 10px;
  width: 200px;
  text-align: center;
  border-radius: 8px;
  border: 1px solid #aaa;
}


button {
  font-size: 18px;
  padding: 12px 20px;
  margin: 10px;
  border-radius: 8px;
  border: none;
  background: #1976d2;
  color: white;
}


#mensaje {
  margin-top: 20px;
  font-size: 22px;
  font-weight: bold;
  padding: 15px;
  border-radius: 10px;
}


.verde {
  background: #c8e6c9;
  color: #1b5e20;
}


.amarillo {
  background: #fff9c4;
  color: #795548;
}


.rojo {
  background: #ffcdd2;
  color: #b71c1c;
}


#contador {
  font-size: 22px;
  font-weight: bold;
  margin: 15px;
}


</style>


</head>




<body>




<div class="contenedor">


<h2>Control de asistencia</h2>


<div id="contador">
Presentes hoy: 0
</div>




<h3>Escanear QR</h3>


<div id="lector"></div>




<button onclick="nuevoEscaneo()">
📷 Nuevo escaneo
</button>




<hr>




<h3>Carga manual por DNI</h3>


<input id="dni" type="number" placeholder="Ingrese DNI">




<br>




<button onclick="enviarDNI()">
Registrar DNI
</button>




<div id="mensaje">
Esperando...
</div>




</div>






<script>




const URL_APPS_SCRIPT =
"https://script.google.com/macros/s/AKfycbzDtGXmfwOfobkyXSHSwe3o5h-lbzS83tZYzha0qDqUE7fBiMweoAhdz94WnMT8aHmQ/exec";




let scanner;






function mostrarResultado(data) {




const mensaje =
document.getElementById("mensaje");




if (data.presentesHoy !== undefined) {


document.getElementById("contador").innerHTML =
"Presentes hoy: " + data.presentesHoy;


}






if (data.encontrado) {




if (data.duplicado) {


mensaje.className = "amarillo";


mensaje.innerHTML =
"⚠️ Ya registrado hoy:<br>" + data.nombre;




} else {




mensaje.className = "verde";


mensaje.innerHTML =
"✅ Presente:<br>" + data.nombre;




}




} else {




mensaje.className = "rojo";


mensaje.innerHTML =
"❌ No encontrado";




}




}






function enviarID(id) {




const url =
URL_APPS_SCRIPT + "?id=" + encodeURIComponent(id);






fetch(url,{
method:"GET",
redirect:"follow"
})




.then(respuesta=>respuesta.json())




.then(data=>{


mostrarResultado(data);


})




.catch(error=>{


document.getElementById("mensaje").innerHTML =
"Error: " + error.message;


});




}








function enviarDNI(){




const dni =
document.getElementById("dni").value;






if(!dni){


document.getElementById("mensaje").innerHTML =
"Ingrese DNI";


return;


}






const url =
URL_APPS_SCRIPT + "?dni=" + encodeURIComponent(dni);






fetch(url,{
method:"GET",
redirect:"follow"
})




.then(respuesta=>respuesta.json())




.then(data=>{


mostrarResultado(data);


})




.catch(error=>{


document.getElementById("mensaje").innerHTML =
"Error: " + error.message;


});




}








function iniciarQR(){




scanner =
new Html5QrcodeScanner(
"lector",
{
fps:10,
qrbox:250
}
);






scanner.render(


(textoQR)=>{




scanner.clear();




enviarID(textoQR);




},




(error)=>{}


);




}






function nuevoEscaneo(){




document.getElementById("lector").innerHTML="";




document.getElementById("mensaje").innerHTML =
"Esperando QR...";




document.getElementById("mensaje").className="";




iniciarQR();




}






iniciarQR();






</script>




</body>
</html>
